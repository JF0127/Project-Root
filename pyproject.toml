[project]
name = "project-root"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av==17.1.0",
    "mediapipe>=1.2.3",
    "numpy>=2.4.6",
    "openai>=3.55.1",
    "opencv-python-headless>=5.1.0.95",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.17.1",
    "sentence-transformers>=6.3.0",
    "soundfile>=0.14.0",
    "swanlab>=0.10.6",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C901"]
ignore = ["SIM108"]

[tool.ruff.lint.mccabe]
max-complexity = 12
